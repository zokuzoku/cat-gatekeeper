<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    html {
      scrollbar-color: #ff6b35 #2e2e2e;
      scrollbar-width: thin;
    }

    *::-webkit-scrollbar {
      width: 10px;
    }

    *::-webkit-scrollbar-track {
      background: #2e2e2e;
      border-radius: 8px;
    }

    *::-webkit-scrollbar-thumb {
      background: #ff6b35;
      border: 2px solid #2e2e2e;
      border-radius: 8px;
    }

    *::-webkit-scrollbar-thumb:hover {
      background: #e55a25;
    }

    body {
      width: 320px;
      font-family: sans-serif;
      padding: 14px;
      background: #1a1a1a;
      color: #fff;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 16px;
      text-align: center;
      color: #fff;
    }

    .section {
      margin-bottom: 14px;
    }

    .section label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .label-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .label-row label {
      margin-bottom: 0;
    }

    .info-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      color: #888;
      font-size: 13px;
      line-height: 1;
      text-decoration: none;
    }

    .info-link:hover {
      color: #ff6b35;
    }

    .info-tooltip {
      position: absolute;
      left: 0;
      bottom: calc(100% + 6px);
      z-index: 10;
      width: 300px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #333;
      color: #f5f5f5;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.5;
      text-align: left;
      white-space: normal;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .info-link:hover + .info-tooltip,
    .info-link:focus-visible + .info-tooltip {
      opacity: 1;
      transform: translateY(0);
    }

    .section input[type="number"] {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: none;
      background: #2e2e2e;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }

    .section textarea {
      width: 100%;
      min-height: 76px;
      padding: 8px;
      border-radius: 8px;
      border: none;
      background: #2e2e2e;
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      resize: vertical;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #ff6b35;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e55a25;
    }

    #dismissBtn {
      background: #444;
      margin-bottom: 12px;
      display: none;
    }

    #dismissBtn:hover {
      background: #555;
    }

    .saved {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
      display: none;
    }

    .hint {
      margin: 6px 0 0;
      font-size: 11px;
      line-height: 1.4;
      color: #888;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      line-height: 1.4;
      color: #ddd;
      cursor: pointer;
    }

    .toggle-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #ff6b35;
    }

    .footer-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .footer-link {
      font-size: 13px;
      font-weight: 500;
      font-family: Arial, sans-serif;
      letter-spacing: 0.08em;
      word-spacing: 2px;
      color: #aaa;
      text-decoration: none;
    }

    .footer-link:hover {
      color: #fff;
      text-decoration: underline;
    }

    .footer-link--release {
      color: #fff;
      letter-spacing: 0;
      word-spacing: normal;
    }
  </style>
</head>
<body>
  <h1>Cat Gatekeeper</h1>

  <div class="section">
    <label data-i18n="usageLimitLabel"></label>
    <input type="number" id="usageLimit" min="1" max="480" value="10">
  </div>

  <div class="section">
    <label data-i18n="breakTimeLabel"></label>
    <input type="number" id="breakTime" min="1" max="60" value="5">
  </div>

  <div class="section">
    <label class="toggle-row">
      <input type="checkbox" id="catEnabled">
      <span data-i18n="catEnabledLabel"></span>
    </label>
  </div>

  <div class="section">
    <div class="label-row">
      <label for="customDomains" data-i18n="targetSNSLabel"></label>
      <a
        class="info-link"
        href="https://zokuzoku.github.io/cat-gatekeeper/#faq"
        data-ja-href="https://zokuzoku.github.io/ja/cat-gatekeeper/#faq"
        target="_blank"
        rel="noopener"
      >&#9432;</a>
      <span class="info-tooltip" data-i18n="targetSitesHelpTitle"></span>
    </div>
    <textarea id="customDomains" spellcheck="false" placeholder="x.com&#10;youtube.com&#10;example.com"></textarea>
    <p class="hint" data-i18n="customDomainsHint"></p>
  </div>

  <button id="dismissBtn" data-i18n="dismissButton"></button>
  <button id="saveBtn" data-i18n="saveButton"></button>
  <div class="saved" id="savedMsg" data-i18n="savedMessage"></div>
  <div class="footer-links">
    <a
      class="footer-link footer-link--release"
      href="https://zokuzoku.github.io/cat-gatekeeper/desktop/"
      data-ja-href="https://zokuzoku.github.io/ja/cat-gatekeeper/desktop/"
      target="_blank"
      rel="noopener"
      data-i18n="desktopReleaseLink"
    ></a>
    <a class="footer-link" href="https://zokuzoku.github.io/cat-gatekeeper/" target="_blank" rel="noopener" data-i18n="officialSiteLink"></a>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
